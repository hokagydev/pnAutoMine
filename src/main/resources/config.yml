# ========================================
#         Конфигурация pnAutoMine
# ========================================

# Провайдер голограмм: AUTO, FANCY, DECENT, NONE
holograms:
  provider: AUTO

# Настройки шахты по умолчанию, можно переопределить для каждой шахты
defaults:
  # Интервал сброса в секундах
  reset-interval: 300
  # Процент для сброса: шахта сбрасывается, когда добыто столько блоков
  reset-percentage: 100
  # Отправлять сообщение о сбросе всем игрокам
  broadcast-reset: true
  # Звук при сбросе (оставьте пустым, чтобы отключить)
  reset-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  # Телепортировать игроков из шахты перед сбросом
  teleport-on-reset: true

# Полностью случайный тип автошахты при КАЖДОМ сбросе.
# Тип может выпасть несколько раз подряд — это настоящий независимый weighted random.
# Сумма процентов может быть любой: плагин автоматически нормализует веса.
random-mine-type:
  enabled: true
  types:
    normal: 70
    rare: 15
    epic: 8
    legendary: 5
    mythic: 2

# Встроенный sidebar-scoreboard. Не требует TAB или PlaceholderAPI.
# Если TAB настроен на свой scoreboard, выберите provider: tab и используйте
# tab-scoreboard-example.yml.
scoreboard:
  enabled: true
  provider: internal
  title: "&b&lАВТОШАХТА"
  lines:
    - "&7Шахта: &f{mine_name}"
    - "&7Тип: {mine_type_display}"
    - "&7Осталось: &f{blocks_remaining}/{blocks_total}"
    - "&7Прогресс: &a{blocks_percentage}%"
    - "&7Сброс: &e{reset_time}"
    - "&8"
    - "&7След. тип: &f{next_type_display}"

# Типы шахт задают состав блоков и отображаемые названия
# У каждого типа есть уникальный ID, который используется в командах
mine-types:
  normal:
    display-name: "&7Обычная шахта"
    blocks:
      STONE: 40
      COBBLESTONE: 30
      ANDESITE: 15
      DIORITE: 10
      GRANITE: 5

  rare:
    display-name: "&9Редкая шахта"
    blocks:
      STONE: 30
      IRON_ORE: 25
      COAL_ORE: 20
      COPPER_ORE: 15
      GOLD_ORE: 10

  epic:
    display-name: "&5Эпическая шахта"
    blocks:
      STONE: 20
      IRON_ORE: 20
      GOLD_ORE: 20
      DIAMOND_ORE: 15
      LAPIS_ORE: 15
      REDSTONE_ORE: 10

  legendary:
    display-name: "&6Легендарная шахта"
    blocks:
      DIAMOND_ORE: 25
      EMERALD_ORE: 20
      GOLD_ORE: 20
      ANCIENT_DEBRIS: 10
      LAPIS_ORE: 15
      REDSTONE_ORE: 10

  mythic:
    display-name: "&c&lМифическая шахта"
    blocks:
      DIAMOND_ORE: 30
      EMERALD_ORE: 25
      ANCIENT_DEBRIS: 20
      GOLD_BLOCK: 10
      DIAMOND_BLOCK: 10
      NETHERITE_BLOCK: 5

# Порядок автоматической смены типов идёт в том же порядке, что и выше.
mine-type-progression:
  enabled: true
  loop: true

# Группы блоков для PlaceholderAPI-статистики добычи.
# Считаются только неотменённые BlockBreakEvent внутри шахты.
# Счётчики относятся к текущему циклу и очищаются при сбросе шахты или перезапуске плагина.
mining-statistics:
  # Количество знаков после точки в %pnautomine_current_player_earnings%.
  salary-decimals: 0
  groups:
    iron:
      materials: [IRON_ORE, DEEPSLATE_IRON_ORE]
      value-per-block: 0.0
    lapis:
      materials: [LAPIS_ORE, DEEPSLATE_LAPIS_ORE]
      value-per-block: 0.0
    emerald:
      materials: [EMERALD_ORE, DEEPSLATE_EMERALD_ORE]
      value-per-block: 0.0
    diamond:
      materials: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
      value-per-block: 0.0
    gold:
      materials: [GOLD_ORE, DEEPSLATE_GOLD_ORE, NETHER_GOLD_ORE]
      value-per-block: 0.0
    coal:
      materials: [COAL_ORE, DEEPSLATE_COAL_ORE]
      value-per-block: 0.0
    stone:
      materials: [STONE, COBBLESTONE, ANDESITE, DIORITE, GRANITE, DEEPSLATE]
      value-per-block: 0.0
    redstone:
      materials: [REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE]
      value-per-block: 0.0

# Настройки голограммы для отображения информации о шахте
hologram:
  enabled: true
  # Строки, которые показываются над шахтой (поддерживаются PlaceholderAPI и внутренние плейсхолдеры)
  # Плейсхолдеры:
  #   {mine_name}          - Отображаемое имя шахты
  #   {mine_id}            - ID шахты
  #   {mine_type}          - Название типа (normal/rare/epic/legendary/mythic)
  #   {mine_type_display}  - Отображаемое название типа с цветами
  #   {blocks_remaining}   - Сколько блоков осталось
  #   {blocks_total}       - Всего блоков в шахте
  #   {blocks_percentage}  - Процент оставшихся блоков
  #   {reset_time}         - Время до следующего сброса в формате строки
  #   {reset_time_seconds} - Время до следующего сброса в секундах
  lines:
    - "&b&l{mine_name}"
    - "&7Тип: {mine_type_display}"
    - "&7Блоков: &f{blocks_remaining}&7/&f{blocks_total} &8(&a{blocks_percentage}%&8)"
    - "&7Сброс через: &e{reset_time}"
  offset:
    x: 0.0
    y: 2.0
    z: 0.0
