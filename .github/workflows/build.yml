name: Build Plugin

# Сборка запускается при пуше в ветку main/master или при создании тега v* (например v1.0.0)
on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Делаем скрипт gradlew исполняемым (на случай проблем с правами)
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Запуск сборки проекта
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # Загрузка готового .jar файла в артефакты GitHub Actions
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pnAutoMine-jar
          path: build/libs/*.jar

  # Если вы создаёте Git-тег (например v1.0.0), GitHub сам создаст Release и прикрепит .jar файл
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: pnAutoMine-jar
          path: build/libs/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
